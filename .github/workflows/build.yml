name: Сборка мода

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Поставить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Поставить Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Собрать мод
        run: gradle build --no-daemon

      - name: Сохранить готовый мод
        uses: actions/upload-artifact@v4
        with:
          name: tokyoghoulrpg-mod
          path: build/libs/*.jar
